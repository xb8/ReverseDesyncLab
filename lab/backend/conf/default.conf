server {
    listen 80;
    server_name localhost;

    default_type text/plain;

    # ==========================================
    # ROOT: lab explanation
    # ==========================================
    location / {
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head><title>CRLF Reverse Desync Lab</title></head>
<body>
<h1>CRLF Reverse Desync Lab</h1>
<p>This lab demonstrates a <b>Reverse Desync</b> (Response Splitting) exploiting:</p>
<ul>
<li><b>Backend</b>: Nginx 1.21.0 with CRLF injection via <code>$uri</code> on <code>/redirect</code></li>
<li><b>BFF</b>: Python reverse proxy with <code>httpx</code> (weak link, no over-read protection)</li>
<li><b>Bypass</b>: <code>Transfer-Encoding: chunked</code> to neutralize Nginx default HTML body</li>
</ul>
<h2>What to test</h2>
<ol>
<li>Visit <code>/api/profile</code> to see the legitimate response (JSON)</li>
<li>Run <code>python3 desync.py</code> to poison the connection</li>
<li>Visit <code>/api/profile</code> again within 30 seconds</li>
<li>You should see <code>alert("XSS via Reverse Desync + TE.Chunked Bypass")</code> instead of the JSON</li>
</ol>
<h2>Vulnerable endpoint</h2>
<p><code>/redirect</code> does <code>return 302 http://localhost$uri</code> (response-side CRLF injection)</p>
<h2>Quick test</h2>
<pre>curl -v "http://localhost:18080/redirect/%0d%0aX-Test:1%0d%0a%0d%0a"</pre>
</body>
</html>';
    }

    # ==========================================
    # VICTIM: legitimate response
    # ==========================================
    location /api/profile {
        add_header Content-Type application/json;
        return 200 '{"user":"victim","email":"victim@example.com"}';
    }

    # ==========================================
    # VULNERABILITY: CRLF INJECTION via $uri
    # ==========================================
    # Nginx decodes $uri. %0d%0a becomes real \r\n in the Location header.
    location /redirect/ {
        return 302 http://localhost$uri;
    }
}